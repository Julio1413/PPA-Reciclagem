[project]
name = "Recicla Já"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "404 Studios" }
]
dependencies = [
    "flet==1.0.0",
    "flet-permission-handler==1.0.0",
    "flet-geolocator==1.0.0"
]

[dependency-groups]
dev = [
    "flet-cli==1.0.0",
    "flet-desktop==1.0.0",
    "flet-web==1.0.0",
    "flet-permission-handler==1.0.0",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]==1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "full"
org = "com.e404studios.reciclaja"
product = "Recicla Já"
company = "404 Studios"
copyright = "Copyright (C) 2026 by 404 Studios"
permissions = ["location"]

[tool.flet.app]
path = "src"